[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-pipeline"
version = "0.1.0"
description = "Hourly weather and air-quality pipeline for ~10 cities (Open-Meteo -> MinIO -> Postgres -> dbt -> Metabase)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "tenacity>=8.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "boto3>=1.34",
    "pyarrow>=16.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "responses>=0.25",
]
dbt = [
    "dbt-postgres>=1.8",
]

[tool.setuptools]
packages = ["ingestion"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt_project"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
